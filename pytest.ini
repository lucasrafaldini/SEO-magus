[pytest]
pythonpath = src
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short --strict-markers
# Test tiers (see CONTRIBUTING.md#tests). Unmarked tests are unit tests: in-process,
# no sockets; `make test-unit` enforces that with --no-network.
markers =
    integration: crosses a process boundary on localhost (HTTP mock sites, fake LLM providers, CLI over HTTP)
    benchmark: benchmark sites and ground-truth sanity checks (quality of the link proposals and audit)
