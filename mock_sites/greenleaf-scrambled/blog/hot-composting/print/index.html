    <h1>Hot Composting Method</h1>
    <p>Hot composting needs a pile of at least one cubic metre, a carbon to nitrogen ratio near 30 to 1 and turning every few days.</p>
    <p>New to this? Read the <a href='/guides/composting/'>complete composting guide</a> before building your first pile.</p>
    <p>A compost tumbler keeps the heat in and makes turning much easier.</p>
